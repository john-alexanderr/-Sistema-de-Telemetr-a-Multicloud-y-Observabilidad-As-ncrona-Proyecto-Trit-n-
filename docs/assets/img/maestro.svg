<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El Maestro de Ceremonias coordina todo y finally garantiza la limpieza">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#1a2340"/>

  <!-- titulo -->
  <g transform="translate(450,36)">
    <rect x="-320" y="-20" width="640" height="40" rx="20" fill="#fff" opacity="0.1" stroke="#fff" stroke-width="1.5"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">🎼 EL MAESTRO DE CEREMONIAS — <tspan fill="#fff">app_operator.py · coordina a todos y limpia al final</tspan></text>
  </g>

  <!-- left: maestro -->
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="240" height="360" rx="16" fill="#fff" stroke="#6b4fa1" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="40" rx="16" fill="#6b4fa1"/><rect x="0" y="24" width="240" height="16" fill="#6b4fa1"/>
    <text x="120" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">🎼 Maestro</text>
    <text x="120" y="32" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#d9ccff">app_operator.py</text>
    <!-- figura -->
    <g transform="translate(80,54)">
      <circle cx="40" cy="26" r="22" fill="#f0c79f" stroke="#1a2340" stroke-width="2"/>
      <circle cx="33" cy="22" r="2" fill="#1a2340"/><circle cx="47" cy="22" r="2" fill="#1a2340"/>
      <path d="M40 36 v18 l-10 22 h20 l-10 -22 v-4" fill="none" stroke="#1a2340" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="18" y="76" width="44" height="28" rx="8" fill="#1a2340"/><text x="40" y="94" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffd25c">CLI</text>
      <!-- batuta -->
      <line x1="62" y1="48" x2="88" y2="22" stroke="#f2b93b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="90" cy="20" r="4" fill="#ffd25c" stroke="#8a6d1a" stroke-width="1.5"/>
    </g>
    <!-- ordenes que da -->
    <g transform="translate(12,182)" font-family="sans-serif" font-size="9" font-weight="600">
      <rect x="0" y="0" width="216" height="22" rx="11" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.2"/><text x="12" y="15" fill="#24316b">1️⃣ Sanitizer, ¡revise la orden!</text>
      <rect x="0" y="28" width="216" height="22" rx="11" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.2"/><text x="12" y="43" fill="#24316b">2️⃣ Core, ¡consulte a los 3!</text>
      <rect x="0" y="56" width="216" height="22" rx="11" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.2"/><text x="12" y="71" fill="#24316b">3️⃣ Tribunal, ¡atentos!</text>
      <rect x="0" y="84" width="216" height="22" rx="11" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.2"/><text x="12" y="99" fill="#24316b">4️⃣ Archivista, ¡registre todo!</text>
    </g>
    <g transform="translate(12,300)">
      <rect x="0" y="0" width="216" height="40" rx="10" fill="#6b4fa1"/>
      <text x="12" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">Sin él, cada personaje</text>
      <text x="12" y="30" font-family="sans-serif" font-size="9" fill="#d9ccff">trabajaría por su cuenta.</text>
    </g>
  </g>

  <!-- center: flujo -->
  <g transform="translate(310,78)">
    <rect x="0" y="0" width="340" height="360" rx="16" fill="#fff" stroke="#c9d4f2" stroke-width="2"/>
    <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#24316b">🖥️ Flujo que coordina</text>

    <g transform="translate(20,36)">
      <!-- usuario -->
      <g>
        <rect x="0" y="0" width="300" height="36" rx="10" fill="#1a2340"/><text x="12" y="14" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffd25c">👤 Usuario escribe:</text><text x="12" y="28" font-family="monospace" font-size="10" fill="#fff">triton --timeout 2 --mode debug</text>
      </g>
      <path d="M150 36 L150 52" stroke="#1a2340" stroke-width="3" marker-end="url(#m1)"/>
      <!-- cli -->
      <g transform="translate(0,52)">
        <rect x="0" y="0" width="300" height="32" rx="10" fill="#eef4ff" stroke="#3a4a8f" stroke-width="1.5"/>
        <text x="12" y="14" font-family="sans-serif" font-size="9" font-weight="800" fill="#24316b">🖥️ CLI — la puerta del usuario</text>
        <text x="12" y="26" font-family="sans-serif" font-size="8" fill="#6b7280">Command Line Interface</text>
      </g>
      <path d="M150 84 L150 100" stroke="#1a2340" stroke-width="3" marker-end="url(#m1)"/>
      <!-- argparse -->
      <g transform="translate(0,100)">
        <rect x="0" y="0" width="300" height="32" rx="10" fill="#fff7e8" stroke="#d9a017" stroke-width="1.5"/>
        <text x="12" y="14" font-family="sans-serif" font-size="9" font-weight="800" fill="#6b4c00">🎮 argparse — el secretario</text>
        <text x="12" y="26" font-family="sans-serif" font-size="8" fill="#8a6d1a">interpreta "--timeout 2" → timeout=2</text>
      </g>
      <path d="M150 132 L150 148" stroke="#1a2340" stroke-width="3" marker-end="url(#m1)"/>
      <!-- validacion -> core -> logging -->
      <g transform="translate(0,148)">
        <rect x="0" y="0" width="300" height="72" rx="12" fill="#f3ecff" stroke="#6b4fa1" stroke-width="1.5"/>
        <text x="12" y="14" font-family="sans-serif" font-size="8" font-weight="700" fill="#4a328f">🛡️ Sanitizer valida → 🎖️ Core consulta (TaskGroup) → 🕵️ Archivista registra</text>
        <g font-family="monospace" font-size="8" fill="#4a328f">
          <text x="12" y="30">sanitizer.validate()</text>
          <text x="12" y="44">await core.scan_all_providers()</text>
          <text x="12" y="58">logging_engine.setup_triton_logging()</text>
        </g>
      </g>
      <path d="M150 220 L150 236" stroke="#1a2340" stroke-width="3" marker-end="url(#m1)"/>
      <!-- finally -->
      <g transform="translate(0,236)">
        <rect x="0" y="0" width="300" height="56" rx="12" fill="#1f9d55" stroke="#145a32" stroke-width="2"/>
        <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#fff">🧹 finally — limpieza SIEMPRE</text>
        <text x="12" y="30" font-family="sans-serif" font-size="8" fill="#c8f0d0">cierra el Listener, libera recursos</text>
        <text x="12" y="44" font-family="monospace" font-size="8" fill="#fff">finally: listener.stop()  # sin return/break</text>
      </g>
      <!-- dos caminos -->
      <g transform="translate(310,236)">
        <rect x="0" y="0" width="14" height="56" rx="7" fill="#1f9d55" opacity="0.15"/>
        <text x="20" y="16" font-family="sans-serif" font-size="8" font-weight="700" fill="#145a32">pase lo</text>
        <text x="20" y="26" font-family="sans-serif" font-size="8" font-weight="700" fill="#145a32">que pase:</text>
        <text x="20" y="38" font-family="sans-serif" font-size="7" fill="#2e7d32">✅ éxito o</text>
        <text x="20" y="48" font-family="sans-serif" font-size="7" fill="#a4262c">💥 error</text>
      </g>
    </g>
  </g>

  <!-- right: finally rule -->
  <g transform="translate(670,78)">
    <rect x="0" y="0" width="190" height="360" rx="16" fill="#fff" stroke="#1f9d55" stroke-width="2.5"/>
    <text x="95" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#145a32">🧹 Limpieza final</text>
    <text x="95" y="38" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">finally en Python</text>

    <g transform="translate(14,52)">
      <rect x="0" y="0" width="162" height="56" rx="12" fill="#1f9d55"/>
      <text x="81" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">Rey: "Pase lo que pase,</text>
      <text x="81" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">limpien antes de irse"</text>
      <text x="81" y="46" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8f0d0">finally: …</text>
    </g>

    <g transform="translate(14,120)">
      <rect x="0" y="0" width="162" height="88" rx="12" fill="#fdecea" stroke="#e25563" stroke-width="2"/>
      <text x="10" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#8b1a1a">🚫 Por qué no return</text>
      <text x="10" y="30" font-family="sans-serif" font-size="8" fill="#6b7280">Si hacés return en</text>
      <text x="10" y="42" font-family="monospace" font-size="8" font-weight="700" fill="#8b1a1a">finally:</text>
      <text x="10" y="54" font-family="sans-serif" font-size="8" fill="#6b7280">tapás el error real.</text>
      <text x="10" y="66" font-family="sans-serif" font-size="8" fill="#6b7280">Es como gritar</text>
      <text x="10" y="78" font-family="sans-serif" font-size="8" fill="#6b7280">"¡todos a casa!" y perder</text>
    </g>
    <g transform="translate(14,220)">
      <rect x="0" y="0" width="162" height="56" rx="12" fill="#fff7e8" stroke="#d9a017" stroke-width="1.5"/>
      <text x="10" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#6b4c00">✅ La regla (PEP 765):</text>
      <text x="10" y="30" font-family="sans-serif" font-size="8" fill="#6b7280">finally solo limpia.</text>
      <text x="10" y="42" font-family="sans-serif" font-size="8" fill="#6b7280">No uses return / break /</text>
      <text x="10" y="54" font-family="sans-serif" font-size="8" fill="#6b7280">continue ahí.</text>
    </g>
    <g transform="translate(14,288)">
      <rect x="0" y="0" width="162" height="52" rx="12" fill="#1a2340"/>
      <text x="10" y="16" font-family="monospace" font-size="8" fill="#8fa0c7">try:</text>
      <text x="22" y="28" font-family="monospace" font-size="8" fill="#fff">  run()</text>
      <text x="10" y="40" font-family="monospace" font-size="8" fill="#ffd25c">finally:</text>
      <text x="22" y="52" font-family="monospace" font-size="8" fill="#7af0c0">  listener.stop()</text>
    </g>
  </g>

  <defs><marker id="m1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a2340"/></marker></defs>
  <text x="450" y="500" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#8fa0c7">🎼 Un director que coordina a todos — y al final, siempre deja el castillo limpio.</text>
</svg>