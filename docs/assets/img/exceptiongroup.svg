<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="La caja ExceptionGroup guarda varios errores juntos">
  <rect x="0" y="0" width="480" height="240" fill="#eef4ff"/>

  <g transform="translate(150,60)">
    <path d="M-70 -30 L70 -30 L90 8 L-90 8 Z" fill="#6b4fa1"/>
    <rect x="-90" y="8" width="180" height="96" fill="#8d6cc7" stroke="#6b4fa1" stroke-width="3"/>
    <path d="M-70 -30 L70 -30 L90 8 L-90 8 Z" fill="none" stroke="#6b4fa1" stroke-width="3" stroke-linejoin="round"/>
    <text x="0" y="12" text-anchor="middle" font-family="serif" font-size="16" font-weight="700" fill="#fff">EXCEPTIONGROUP</text>

    <g transform="translate(-42,34)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#ffffff" stroke="#e25563" stroke-width="3"/>
      <text x="12" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#c33">⏳ Timeout</text>
      <text x="12" y="42" font-family="monospace" font-size="9" fill="#555">ProviderTimeoutError</text>
    </g>
    <g transform="translate(30,34)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#ffffff" stroke="#2fa8a0" stroke-width="3"/>
      <text x="12" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#1c7a74">📦 Payload</text>
      <text x="12" y="42" font-family="monospace" font-size="9" fill="#555">CorruptedPayloadError</text>
    </g>
  </g>

  <g transform="translate(358,166)">
    <circle cx="26" cy="22" r="20" fill="#ffd25c" stroke="#d9a017" stroke-width="3"/>
    <text x="14" y="28" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6b4c00">except*</text>
  </g>
  <g fill="none" stroke="#6b4fa1" stroke-width="2" stroke-dasharray="5 5">
    <path d="M330 180 h28"/>
  </g>

  <text x="240" y="228" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#24316b">📦 Una caja que no deja perder ningún error</text>
</svg>