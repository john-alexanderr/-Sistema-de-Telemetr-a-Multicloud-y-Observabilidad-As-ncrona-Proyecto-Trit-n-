<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="El Tribunal de Errores clasifica cada problema">
  <rect x="0" y="0" width="480" height="240" fill="#f3ecff"/>

  <g transform="translate(240,60)">
    <rect x="-120" y="8" width="240" height="110" rx="8" fill="#ffffff" stroke="#6b4fa1" stroke-width="4"/>
    <g fill="none" stroke="#6b4fa1" stroke-width="3" stroke-linecap="round">
      <line x1="-52" y1="26" x2="52" y2="26"/>
      <line x1="-34" y1="22" x2="-60" y2="18"/>
      <line x1="34" y1="22" x2="60" y2="18"/>
    </g>
    <text x="0" y="62" text-anchor="middle" font-family="serif" font-size="15" font-weight="700" fill="#4a328f">⚖️ Tribunal de Errores</text>
    <text x="0" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6f8f">clasifica y nombra cada problema</text>
  </g>

  <g font-family="sans-serif" font-size="10.5" font-weight="700">
    <g transform="translate(48,70)">
      <rect x="0" y="0" width="110" height="44" rx="8" fill="#6b4fa1"/>
      <text x="6" y="18" fill="#fff" font-size="12">⏳ Timeout</text>
      <text x="6" y="34" fill="#d9ccff" font-size="9">ProviderTimeoutError</text>
    </g>
    <g transform="translate(180,150)">
      <rect x="0" y="0" width="120" height="44" rx="8" fill="#e25563"/>
      <text x="6" y="18" fill="#fff" font-size="12">📦 Payload</text>
      <text x="6" y="34" fill="#ffd7db" font-size="9">CorruptedPayloadError</text>
    </g>
    <g transform="translate(322,70)">
      <rect x="0" y="0" width="122" height="44" rx="8" fill="#2fa8a0"/>
      <text x="6" y="18" fill="#fff" font-size="12">🌉 Red</text>
      <text x="6" y="34" fill="#d7f5f2" font-size="9">NetworkPeeringError</text>
    </g>
  </g>

  <g fill="none" stroke="#6b4fa1" stroke-width="2" opacity="0.6" stroke-dasharray="5 5">
    <path d="M158 118 h28 M300 118 h28"/>
  </g>

  <text x="240" y="222" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#4a328f">Un nombre preciso para cada problema</text>
</svg>