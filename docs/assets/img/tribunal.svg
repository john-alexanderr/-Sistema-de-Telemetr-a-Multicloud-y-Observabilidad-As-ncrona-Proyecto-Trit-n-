<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El Tribunal de Errores clasifica cada problema con un nombre preciso">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#f3ecff"/>

  <g transform="translate(450,36)">
    <rect x="-320" y="-20" width="640" height="40" rx="20" fill="#1a2340"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">⚖️ EL TRIBUNAL DE ERRORES — <tspan fill="#fff">cada problema tiene su nombre · </tspan><tspan fill="#b9a7ff">exceptions.py</tspan></text>
  </g>

  <!-- analogia medico -->
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="820" height="54" rx="12" fill="#fff" stroke="#6b4fa1" stroke-width="2"/>
    <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#4a328f">🩺 Como un médico: no dice "están enfermos" — diagnostica a cada paciente:</text>
    <g font-family="sans-serif" font-size="10" font-weight="700">
      <rect x="16" y="28" width="150" height="18" rx="9" fill="#fdecea" stroke="#e25563" stroke-width="1.2"/><text x="24" y="40" fill="#8b1a1a">🤒 Fiebre</text><text x="92" y="40" fill="#6b7280" font-weight="600">→ fiebre</text>
      <rect x="180" y="28" width="160" height="18" rx="9" fill="#ffe9a8" stroke="#d9a017" stroke-width="1.2"/><text x="188" y="40" fill="#6b4c00">🦴 Pierna rota</text><text x="272" y="40" fill="#6b7280" font-weight="600">→ fractura</text>
      <rect x="354" y="28" width="170" height="18" rx="9" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.2"/><text x="362" y="40" fill="#24316b">😵 Desmayado</text><text x="444" y="40" fill="#6b7280" font-weight="600">→ desmayo</text>
      <text x="560" y="40" font-size="10" fill="#4a328f">Igual con errores → <tspan font-weight="800">nombre preciso</tspan></text>
    </g>
  </g>

  <!-- jerarquia -->
  <g transform="translate(450,160)">
    <!-- TritonError -->
    <g transform="translate(-120,-30)">
      <rect x="0" y="0" width="240" height="60" rx="14" fill="#6b4fa1" stroke="#4a328f" stroke-width="3"/>
      <text x="120" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#d9ccff">👑 Rey de los Errores</text>
      <text x="120" y="42" text-anchor="middle" font-family="monospace" font-size="14" font-weight="800" fill="#fff">TritonError</text>
      <text x="120" y="54" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#d9ccff">hereda de Exception · familia propia del Reino</text>
    </g>
    <!-- lineas -->
    <g stroke="#6b4fa1" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 30 L0 58"/><path d="M0 58 L-260 58 L-260 84"/><path d="M0 58 L0 84"/><path d="M0 58 L260 58 L260 84"/>
    </g>
    <!-- hijos -->
    <!-- Timeout -->
    <g transform="translate(-380,84)">
      <rect x="0" y="0" width="240" height="150" rx="14" fill="#fff" stroke="#d9a017" stroke-width="3"/>
      <rect x="0" y="0" width="240" height="36" rx="14" fill="#d9a017"/><rect x="0" y="22" width="240" height="14" fill="#d9a017"/>
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">⏳ ProviderTimeoutError</text>
      <g transform="translate(14,48)">
        <text font-family="sans-serif" font-size="10" font-weight="700" fill="#6b4c00">Cuándo ocurre:</text>
        <text y="16" font-family="sans-serif" font-size="9" fill="#6b7280">El proveedor no responde a tiempo</text>
        <text y="30" font-family="sans-serif" font-size="9" fill="#6b7280">dentro del timeout (ej. 2 s)</text>
        <rect x="0" y="42" width="212" height="30" rx="8" fill="#fff7e8" stroke="#f2d28b" stroke-width="1.2"/>
        <text x="8" y="18" font-family="monospace" font-size="8" fill="#6b4c00">httpx.Timeout → raise ... from</text>
        <text x="8" y="28" font-family="sans-serif" font-size="7" fill="#8a6d1a">Origen: httpx.TimeoutException</text>
      </g>
      <text x="120" y="142" text-anchor="middle" font-size="18">⏳</text>
    </g>
    <!-- Payload -->
    <g transform="translate(-120,84)">
      <rect x="0" y="0" width="240" height="150" rx="14" fill="#fff" stroke="#e25563" stroke-width="3"/>
      <rect x="0" y="0" width="240" height="36" rx="14" fill="#e25563"/><rect x="0" y="22" width="240" height="14" fill="#e25563"/>
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">📦 CorruptedPayloadError</text>
      <g transform="translate(14,48)">
        <text font-family="sans-serif" font-size="10" font-weight="700" fill="#8b1a1a">Cuándo ocurre:</text>
        <text y="16" font-family="sans-serif" font-size="9" fill="#6b7280">La respuesta no es JSON válido</text>
        <text y="30" font-family="sans-serif" font-size="9" fill="#6b7280">o status es 4xx/5xx</text>
        <rect x="0" y="42" width="212" height="30" rx="8" fill="#fdecea" stroke="#f0a0a8" stroke-width="1.2"/>
        <text x="8" y="18" font-family="monospace" font-size="8" fill="#8b1a1a">JSONDecodeError · HTTP 504</text>
        <text x="8" y="28" font-family="sans-serif" font-size="7" fill="#a4262c">Origen: JSON o HTTPStatusError</text>
      </g>
      <text x="120" y="142" text-anchor="middle" font-size="18">📄❌</text>
    </g>
    <!-- Network -->
    <g transform="translate(140,84)">
      <rect x="0" y="0" width="240" height="150" rx="14" fill="#fff" stroke="#2fa8a0" stroke-width="3"/>
      <rect x="0" y="0" width="240" height="36" rx="14" fill="#2fa8a0"/><rect x="0" y="22" width="240" height="14" fill="#2fa8a0"/>
      <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">🌉 NetworkPeeringError</text>
      <g transform="translate(14,48)">
        <text font-family="sans-serif" font-size="10" font-weight="700" fill="#16504c">Cuándo ocurre:</text>
        <text y="16" font-family="sans-serif" font-size="9" fill="#6b7280">Falla la red / DNS / peering</text>
        <text y="30" font-family="sans-serif" font-size="9" fill="#6b7280">no se puede ni conectar</text>
        <rect x="0" y="42" width="212" height="30" rx="8" fill="#e6f7f5" stroke="#8fd4ce" stroke-width="1.2"/>
        <text x="8" y="18" font-family="monospace" font-size="8" fill="#16504c">httpx.RequestError</text>
        <text x="8" y="28" font-family="sans-serif" font-size="7" fill="#1d7a74">Origen: RequestError</text>
      </g>
      <text x="120" y="142" text-anchor="middle" font-size="18">🌉💥</text>
    </g>
  </g>

  <!-- bottom -->
  <g transform="translate(40,456)">
    <rect x="0" y="0" width="820" height="48" rx="12" fill="#4a328f"/>
    <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffd25c">💡 ¿Por qué no un solo "Error" genérico?</text>
    <text x="16" y="36" font-family="sans-serif" font-size="10" fill="#d9ccff">"Algo salió mal" <tspan fill="#ff8a8a">❌ no ayuda</tspan> · "Azure timeout 2 s" <tspan fill="#7af0c0">✅ permite investigar y actuar</tspan> · Cada error dice <tspan font-weight="800" fill="#fff">qué pasó y dónde</tspan></text>
  </g>
</svg>