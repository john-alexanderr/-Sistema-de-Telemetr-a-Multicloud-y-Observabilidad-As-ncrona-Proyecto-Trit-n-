<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El Caballero Sanitizer revisa cada orden en la puerta del castillo">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#eef4ff"/>

  <!-- titulo -->
  <g transform="translate(450,38)">
    <rect x="-300" y="-22" width="600" height="40" rx="20" fill="#fff" stroke="#3a4a8f" stroke-width="2.5"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#24316b">🛡️ LA PUERTA DEL CASTILLO — <tspan fill="#6b4fa1">sanitizer.py</tspan> <tspan font-weight="600" fill="#6b7280">· ninguna orden inválida entra al Reino</tspan></text>
  </g>

  <!-- puerta castillo bg -->
  <g transform="translate(90,82)">
    <rect x="0" y="0" width="260" height="340" rx="14" fill="#dfe6ff" stroke="#3a4a8f" stroke-width="3"/>
    <path d="M0 52 L130 8 L260 52" fill="#f2b93b" stroke="#3a4a8f" stroke-width="3" stroke-linejoin="round"/>
    <rect x="78" y="120" width="104" height="152" rx="52" fill="#1a2340"/>
    <rect x="86" y="128" width="88" height="144" rx="44" fill="#8a6d1a" stroke="#f2b93b" stroke-width="3"/>
    <circle cx="148" cy="188" r="7" fill="#f2b93b" stroke="#1a2340" stroke-width="2"/>
    <!-- caballero -->
    <g transform="translate(130,300)">
      <circle cx="0" cy="-28" r="26" fill="#f0c79f" stroke="#8a6d1a" stroke-width="3"/>
      <!-- casco -->
      <path d="M-22 -42 Q0 -66 22 -42 L18 -28 Q0 -22 -18 -28 Z" fill="#8fa0c7" stroke="#3a4a8f" stroke-width="3"/>
      <rect x="-24" y="-18" width="48" height="8" rx="4" fill="#3a4a8f"/>
      <circle cx="-7" cy="-12" r="2.5" fill="#1a2340"/><circle cx="7" cy="-12" r="2.5" fill="#1a2340"/>
      <rect x="-18" y="10" width="36" height="50" rx="8" fill="#6b4fa1" stroke="#3a4a8f" stroke-width="2.5"/>
      <text x="0" y="42" text-anchor="middle" font-size="16">🛡️</text>
      <rect x="-42" y="-2" width="14" height="42" rx="7" fill="#8fa0c7" stroke="#3a4a8f" stroke-width="2"/>
      <rect x="28" y="-2" width="14" height="42" rx="7" fill="#8fa0c7" stroke="#3a4a8f" stroke-width="2"/>
    </g>
    <text x="130" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#3a4a8f">Caballero Sanitizer</text>
    <text x="130" y="404" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#6b4fa1">sanitizer.py</text>
  </g>

  <!-- flecha del mensajero -->
  <g transform="translate(360,210)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#fff" stroke="#3a4a8f" stroke-width="2"/>
    <text x="55" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#24316b">Mensajero →</text>
    <text x="55" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">trae una orden</text>
    <path d="M110 18 L126 18" stroke="#3a4a8f" stroke-width="3" marker-end="url(#arr)"/>
  </g>

  <!-- tabla de ejemplos -->
  <g transform="translate(490,82)">
    <rect x="0" y="0" width="380" height="360" rx="14" fill="#fff" stroke="#c9d4f2" stroke-width="2.5"/>
    <!-- header -->
    <rect x="0" y="0" width="380" height="38" rx="14" fill="#1a2340"/>
    <rect x="0" y="24" width="380" height="14" fill="#1a2340"/>
    <text x="190" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffd25c">📋 ¿COMO DECIDE EL CABALLERO?</text>
    <!-- filas -->
    <g font-family="sans-serif">
      <!-- fila 1: timeout 2 OK -->
      <g transform="translate(14,54)">
        <rect x="0" y="0" width="352" height="56" rx="10" fill="#e8f5e9" stroke="#1f9d55" stroke-width="2"/>
        <text x="12" y="18" font-size="11" font-weight="800" fill="#145a32">Orden:</text>
        <text x="58" y="18" font-family="monospace" font-size="12" font-weight="800" fill="#145a32">timeout = 2</text>
        <text x="12" y="34" font-size="10" fill="#2e7d32">Regla: 0.1 ≤ timeout ≤ 5 segundos</text>
        <text x="12" y="48" font-size="9" fill="#6b7280">→ 2 está dentro del rango</text>
        <g transform="translate(294,10)">
          <rect x="0" y="0" width="48" height="26" rx="13" fill="#1f9d55"/><text x="24" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✅ PASA</text>
        </g>
      </g>
      <!-- fila 2: timeout -10 FAIL -->
      <g transform="translate(14,120)">
        <rect x="0" y="0" width="352" height="56" rx="10" fill="#fdecea" stroke="#e25563" stroke-width="2"/>
        <text x="12" y="18" font-size="11" font-weight="800" fill="#8b1a1a">Orden:</text>
        <text x="58" y="18" font-family="monospace" font-size="12" font-weight="800" fill="#8b1a1a">timeout = -10</text>
        <text x="12" y="34" font-size="10" fill="#a4262c">Regla: no existen segundos negativos</text>
        <text x="12" y="48" font-size="9" fill="#6b7280">→ rechazado antes de llegar al core</text>
        <g transform="translate(276,10)">
          <rect x="0" y="0" width="66" height="26" rx="13" fill="#e25563"/><text x="33" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">❌ RECHAZADO</text>
        </g>
      </g>
      <!-- fila 3: PATATA -->
      <g transform="translate(14,186)">
        <rect x="0" y="0" width="352" height="56" rx="10" fill="#fdecea" stroke="#e25563" stroke-width="2"/>
        <text x="12" y="18" font-size="11" font-weight="800" fill="#8b1a1a">Orden:</text>
        <text x="58" y="18" font-family="monospace" font-size="12" font-weight="800" fill="#8b1a1a">timeout = "PATATA"</text>
        <text x="12" y="34" font-size="10" fill="#a4262c">Regla: debe ser un número</text>
        <text x="12" y="48" font-size="9" fill="#6b7280">→ ni siquiera es un número</text>
        <g transform="translate(276,10)">
          <rect x="0" y="0" width="66" height="26" rx="13" fill="#e25563"/><text x="33" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">❌ RECHAZADO</text>
        </g>
      </g>
      <!-- fila 4: cluster ok -->
      <g transform="translate(14,252)">
        <rect x="0" y="0" width="352" height="46" rx="10" fill="#e8f5e9" stroke="#1f9d55" stroke-width="2"/>
        <text x="12" y="18" font-size="11" font-weight="800" fill="#145a32">Cluster:</text>
        <text x="62" y="18" font-family="monospace" font-size="11" font-weight="800" fill="#145a32">cluster-us-east-01</text>
        <text x="12" y="34" font-size="10" fill="#2e7d32">Patrón <tspan font-family="monospace">cluster-&lt;nombre&gt;-&lt;n&gt;</tspan> ✓</text>
        <g transform="translate(294,10)">
          <rect x="0" y="0" width="48" height="26" rx="13" fill="#1f9d55"/><text x="24" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✅ PASA</text>
        </g>
      </g>
      <!-- fila 5: cluster mal -->
      <g transform="translate(14,308)">
        <rect x="0" y="0" width="352" height="46" rx="10" fill="#fdecea" stroke="#e25563" stroke-width="2"/>
        <text x="12" y="18" font-size="11" font-weight="800" fill="#8b1a1a">Cluster:</text>
        <text x="62" y="18" font-family="monospace" font-size="10" font-weight="800" fill="#8b1a1a">hola-soy-un-cluster</text>
        <text x="12" y="34" font-size="10" fill="#a4262c">No empieza con <tspan font-family="monospace">cluster-</tspan> ✗</text>
        <g transform="translate(276,10)">
          <rect x="0" y="0" width="66" height="26" rx="13" fill="#e25563"/><text x="33" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">❌ RECHAZADO</text>
        </g>
      </g>
    </g>
  </g>

  <!-- nota regex -->
  <g transform="translate(490,456)">
    <rect x="0" y="0" width="380" height="46" rx="10" fill="#fff7e8" stroke="#f2b93b" stroke-width="2"/>
    <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#6b4c00">🔍 La piedra del reglamento (expresión regular re):</text>
    <text x="14" y="34" font-family="monospace" font-size="10" font-weight="700" fill="#6b4c00">^cluster-[a-z]+(-[a-z]+)*-\d+$</text>
    <text x="284" y="34" font-family="sans-serif" font-size="9" fill="#8a6d1a">«todo id debe empezar con cluster-»</text>
  </g>

  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a4a8f"/></marker></defs>
  <text x="450" y="510" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#24316b">Es mejor frenar un dato malo en la puerta que dejarlo romper el sistema adentro — esa es la validación.</text>
</svg>