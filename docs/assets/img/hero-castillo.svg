<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El castillo del Reino Tritón y los tres territorios AWS, Azure y GCP">
  <defs>
    <linearGradient id="cielo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c6ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="18" fill="url(#cielo2)"/>

  <!-- sol -->
  <circle cx="780" cy="78" r="32" fill="#ffd25c" stroke="#e8a800" stroke-width="4"/>
  <g stroke="#ffd25c" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="780" y1="18" x2="780" y2="34"/><line x1="780" y1="122" x2="780" y2="138"/>
    <line x1="720" y1="78" x2="736" y2="78"/><line x1="824" y1="78" x2="840" y2="78"/>
    <line x1="738" y1="36" x2="750" y2="48"/><line x1="810" y1="108" x2="822" y2="120"/>
    <line x1="738" y1="120" x2="750" y2="108"/><line x1="810" y1="36" x2="822" y2="48"/>
  </g>

  <!-- nubes territorios -->
  <g font-family="sans-serif" font-weight="800" text-anchor="middle">
    <!-- AWS -->
    <g transform="translate(140,90)">
      <ellipse cx="0" cy="0" rx="110" ry="48" fill="#fff" opacity="0.95"/>
      <ellipse cx="-38" cy="-12" rx="52" ry="32" fill="#fff" opacity="0.95"/>
      <ellipse cx="42" cy="-10" rx="56" ry="30" fill="#fff" opacity="0.95"/>
      <rect x="-62" y="42" width="124" height="40" rx="12" fill="#ff7a59" stroke="#c44a2e" stroke-width="3"/>
      <text x="0" y="68" font-size="18" fill="#fff">☁️ AWS</text>
      <text x="0" y="105" font-size="11" font-weight="600" fill="#6b2a1a">Territorio Este</text>
      <text x="0" y="122" font-size="10" font-weight="600" fill="#8a8fb0">800 km del castillo</text>
    </g>
    <!-- Azure -->
    <g transform="translate(450,70)">
      <ellipse cx="0" cy="0" rx="120" ry="50" fill="#fff" opacity="0.95"/>
      <ellipse cx="-44" cy="-14" rx="54" ry="34" fill="#fff" opacity="0.95"/>
      <ellipse cx="46" cy="-12" rx="60" ry="32" fill="#fff" opacity="0.95"/>
      <rect x="-66" y="44" width="132" height="40" rx="12" fill="#2fa8a0" stroke="#1d7a74" stroke-width="3"/>
      <text x="0" y="70" font-size="18" fill="#fff">☁️ AZURE</text>
      <text x="0" y="107" font-size="11" font-weight="600" fill="#16504c">Territorio Norte</text>
      <text x="0" y="124" font-size="10" font-weight="600" fill="#8a8fb0">950 km del castillo</text>
    </g>
    <!-- GCP -->
    <g transform="translate(760,105)">
      <ellipse cx="0" cy="0" rx="105" ry="46" fill="#fff" opacity="0.95"/>
      <ellipse cx="-36" cy="-12" rx="48" ry="30" fill="#fff" opacity="0.95"/>
      <ellipse cx="38" cy="-10" rx="52" ry="28" fill="#fff" opacity="0.95"/>
      <rect x="-58" y="42" width="116" height="40" rx="12" fill="#4285f4" stroke="#244e9a" stroke-width="3"/>
      <text x="0" y="68" font-size="18" fill="#fff">☁️ GCP</text>
      <text x="0" y="105" font-size="11" font-weight="600" fill="#1a3a7a">Territorio Oeste</text>
      <text x="0" y="122" font-size="10" font-weight="600" fill="#8a8fb0">1100 km del castillo</text>
    </g>
  </g>

  <!-- caminos punteados -->
  <g fill="none" stroke="#8a6d1a" stroke-width="3" stroke-dasharray="10 10" opacity="0.7" stroke-linecap="round">
    <path d="M210 178 Q340 300 430 382"/>
    <path d="M450 178 Q450 280 450 382"/>
    <path d="M690 190 Q570 290 470 382"/>
  </g>
  <!-- hitos km -->
  <g font-family="sans-serif" font-size="10" font-weight="700" fill="#6b4c00" text-anchor="middle">
    <rect x="268" y="238" width="58" height="18" rx="9" fill="#fff" opacity="0.85"/><text x="297" y="251">— 400 km —</text>
    <rect x="421" y="248" width="58" height="18" rx="9" fill="#fff" opacity="0.85"/><text x="450" y="261">— 500 km —</text>
    <rect x="574" y="238" width="58" height="18" rx="9" fill="#fff" opacity="0.85"/><text x="603" y="251">— 550 km —</text>
  </g>

  <!-- suelo -->
  <rect x="0" y="420" width="900" height="100" fill="#8a6d1a"/>
  <rect x="0" y="420" width="900" height="18" fill="#6b4c00" opacity="0.3"/>

  <!-- castillo -->
  <g transform="translate(450,420)">
    <!-- base -->
    <rect x="-220" y="-80" width="440" height="80" rx="6" fill="#2f3b76" stroke="#1a2340" stroke-width="4"/>
    <!-- torre izq -->
    <rect x="-200" y="-160" width="90" height="80" rx="4" fill="#2f3b76" stroke="#1a2340" stroke-width="4"/>
    <rect x="-200" y="-180" width="90" height="22" fill="#f2b93b" stroke="#1a2340" stroke-width="3"/>
    <rect x="-188" y="-185" width="18" height="14" fill="#2f3b76"/><rect x="-162" y="-185" width="18" height="14" fill="#2f3b76"/><rect x="-136" y="-185" width="18" height="14" fill="#2f3b76"/>
    <rect x="-172" y="-120" width="18" height="24" rx="9" fill="#8fa0c7" stroke="#1a2340" stroke-width="2"/>
    <!-- torre der -->
    <rect x="110" y="-160" width="90" height="80" rx="4" fill="#2f3b76" stroke="#1a2340" stroke-width="4"/>
    <rect x="110" y="-180" width="90" height="22" fill="#f2b93b" stroke="#1a2340" stroke-width="3"/>
    <rect x="122" y="-185" width="18" height="14" fill="#2f3b76"/><rect x="148" y="-185" width="18" height="14" fill="#2f3b76"/><rect x="174" y="-185" width="18" height="14" fill="#2f3b76"/>
    <rect x="138" y="-120" width="18" height="24" rx="9" fill="#8fa0c7" stroke="#1a2340" stroke-width="2"/>
    <!-- torre central + puerta -->
    <rect x="-70" y="-200" width="140" height="120" rx="4" fill="#3a4a8f" stroke="#1a2340" stroke-width="4"/>
    <rect x="-70" y="-220" width="140" height="24" fill="#f2b93b" stroke="#1a2340" stroke-width="3"/>
    <rect x="-58" y="-225" width="16" height="14" fill="#3a4a8f"/><rect x="-30" y="-225" width="16" height="14" fill="#3a4a8f"/><rect x="-2" y="-225" width="16" height="14" fill="#3a4a8f"/><rect x="26" y="-225" width="16" height="14" fill="#3a4a8f"/><rect x="54" y="-225" width="16" height="14" fill="#3a4a8f"/>
    <!-- puerta -->
    <rect x="-36" y="-66" width="72" height="66" rx="36" fill="#1a2340"/>
    <rect x="-30" y="-60" width="60" height="60" rx="30" fill="#8a6d1a" stroke="#f2b93b" stroke-width="3"/>
    <circle cx="18" cy="-30" r="5" fill="#f2b93b" stroke="#1a2340" stroke-width="2"/>
    <rect x="-30" y="-60" width="60" height="14" rx="4" fill="#1a2340" opacity="0.25"/>
    <!-- ventanas rey -->
    <rect x="-46" y="-150" width="28" height="30" rx="14" fill="#ffd25c" stroke="#1a2340" stroke-width="2"/>
    <rect x="18" y="-150" width="28" height="30" rx="14" fill="#ffd25c" stroke="#1a2340" stroke-width="2"/>
    <text x="-32" y="-130" text-anchor="middle" font-size="14">👑</text><text x="32" y="-130" text-anchor="middle" font-size="14">👑</text>
    <!-- bandera -->
    <line x1="0" y1="-220" x2="0" y2="-260" stroke="#1a2340" stroke-width="4"/>
    <path d="M0 -260 L58 -246 L0 -232 Z" fill="#e25563" stroke="#1a2340" stroke-width="2"/>
    <text x="20" y="-242" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">TRITÓN</text>
  </g>

  <!-- cartucho mision -->
  <g transform="translate(450,468)">
    <rect x="-360" y="-22" width="720" height="44" rx="22" fill="#1a2340" opacity="0.9"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">👑 MISIÓN DEL REY: consultar los 3 territorios <tspan fill="#fff">→ detectar qué falló → dejar registro forense</tspan></text>
  </g>

  <text x="450" y="500" text-anchor="middle" font-family="serif" font-size="13" font-style="italic" fill="#1a2340">Tres caminos largos — la red puede tardar, equivocarse o caerse. Por eso el Reino necesita un sistema.</text>
</svg>