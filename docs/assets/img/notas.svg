<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El error conserva su causa original y permite agregar notas amarillas">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#fff7e8"/>

  <g transform="translate(450,36)">
    <rect x="-320" y="-20" width="640" height="40" rx="20" fill="#1a2340"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">📝 EL ERROR TIENE HISTORIA — <tspan fill="#fff">raise ... from + add_note</tspan></text>
  </g>

  <!-- left: causa original conservada -->
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="400" height="360" rx="16" fill="#fff" stroke="#3a4a8f" stroke-width="2.5"/>
    <rect x="0" y="0" width="400" height="44" rx="16" fill="#3a4a8f"/><rect x="0" y="28" width="400" height="16" fill="#3a4a8f"/>
    <text x="200" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">🔗 CONSERVAR LA CAUSA — raise ... from</text>
    <text x="200" y="36" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#c9d4f2">no destruyo la evidencia original</text>

    <!-- cadena -->
    <g transform="translate(60,62)">
      <!-- httpx -->
      <rect x="0" y="0" width="280" height="64" rx="12" fill="#eef4ff" stroke="#8fa0c7" stroke-width="2"/>
      <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#24316b">1️⃣ Error técnico original</text>
      <text x="14" y="36" font-family="monospace" font-size="11" font-weight="700" fill="#1a2340">httpx.TimeoutException</text>
      <text x="14" y="52" font-family="sans-serif" font-size="9" fill="#6b7280">lo que realmente tiró la librería httpx</text>
      <text x="260" y="18" font-size="16">🔧</text>
    </g>
    <!-- flecha from -->
    <g transform="translate(200,126)">
      <rect x="-46" y="0" width="92" height="28" rx="14" fill="#1a2340"/><text x="0" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="800" fill="#ffd25c">from</text>
      <path d="M0 28 L0 38" stroke="#1a2340" stroke-width="3" marker-end="url(#a1)"/>
      <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">↓ raise ... from</text>
    </g>
    <!-- Triton -->
    <g transform="translate(60,178)">
      <rect x="0" y="0" width="280" height="74" rx="12" fill="#6b4fa1" stroke="#4a328f" stroke-width="2.5"/>
      <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#d9ccff">2️⃣ Error del Reino (con sentido de negocio)</text>
      <text x="14" y="38" font-family="monospace" font-size="12" font-weight="800" fill="#fff">ProviderTimeoutError</text>
      <text x="14" y="56" font-family="sans-serif" font-size="9" fill="#d9ccff">«Azure no respondió en 2 s» — lo entiende el Rey</text>
      <circle cx="252" cy="18" r="14" fill="#ffd25c"/><text x="252" y="23" text-anchor="middle" font-size="12">👑</text>
    </g>
    <!-- evidencia -->
    <g transform="translate(20,272)">
      <rect x="0" y="0" width="360" height="72" rx="12" fill="#f3ecff" stroke="#d9ccff" stroke-width="1.5"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#4a328f">🔍 ¿Por qué conservar la causa?</text>
      <text x="12" y="34" font-family="sans-serif" font-size="9" fill="#6b7280">Podés recorrer la cadena completa:</text>
      <text x="12" y="50" font-family="monospace" font-size="9" font-weight="700" fill="#4a328f">httpx.Timeout → ProviderTimeoutError</text>
      <text x="12" y="64" font-family="sans-serif" font-size="8" fill="#6b4fa1">__cause__ guarda el error original · el forense ve TODO el camino</text>
    </g>
  </g>

  <!-- right: add_note -->
  <g transform="translate(470,78)">
    <rect x="0" y="0" width="390" height="360" rx="16" fill="#fff" stroke="#d9a017" stroke-width="2.5"/>
    <rect x="0" y="0" width="390" height="44" rx="16" fill="#d9a017"/><rect x="0" y="28" width="390" height="16" fill="#d9a017"/>
    <text x="195" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff">🟨 LA NOTA AMARILLA — add_note()</text>
    <text x="195" y="36" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#fff7cc">información extra pegada al expediente</text>

    <!-- expediente -->
    <g transform="translate(30,62)">
      <rect x="0" y="0" width="330" height="120" rx="12" fill="#fff" stroke="#8fa0c7" stroke-width="2"/>
      <rect x="0" y="0" width="330" height="28" rx="12" fill="#eef4ff"/><rect x="0" y="16" width="330" height="12" fill="#eef4ff"/>
      <text x="12" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#24316b">📋 EXPEDIENTE: ProviderTimeoutError</text>
      <g font-family="monospace" font-size="9" fill="#1a2340">
        <text x="12" y="44">proveedor: "azure"</text>
        <text x="12" y="58">timeout: 2.0</text>
        <text x="12" y="72">__cause__: TimeoutException</text>
      </g>
      <!-- nota pegada -->
      <g transform="translate(180,36) rotate(4)">
        <rect x="0" y="0" width="140" height="82" rx="4" fill="#ffe34d" stroke="#e6c200" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="0" />
        <text x="10" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#6b4c00">🟨 NOTA (add_note)</text>
        <text x="10" y="30" font-family="sans-serif" font-size="8" fill="#6b4c00">HTTP_Status_Code:</text>
        <text x="10" y="42" font-family="monospace" font-size="8" font-weight="700" fill="#6b4c00">  504 Gateway Timeout</text>
        <text x="10" y="56" font-family="sans-serif" font-size="8" fill="#6b4c00">HTTP_Method: GET</text>
        <text x="10" y="70" font-family="sans-serif" font-size="8" fill="#6b4c00">cluster-az-01</text>
        <circle cx="70" cy="-6" r="6" fill="#d9a017" stroke="#6b4c00" stroke-width="1.5"/>
      </g>
    </g>
    <!-- codigo -->
    <g transform="translate(30,198)">
      <rect x="0" y="0" width="330" height="64" rx="10" fill="#1a2340"/>
      <text x="12" y="18" font-family="monospace" font-size="10" fill="#8fa0c7">exc = <tspan fill="#fff">ProviderTimeoutError</tspan>(msg)</text>
      <text x="12" y="34" font-family="monospace" font-size="10" fill="#8fa0c7">exc.<tspan fill="#ffd25c">add_note</tspan>(f"HTTP_Status_Code: {52}04")</text>
      <text x="12" y="50" font-family="monospace" font-size="10" fill="#8fa0c7"><tspan fill="#ffd25c">raise</tspan> exc <tspan fill="#ffd25c">from</tspan> cause</text>
    </g>
    <!-- beneficio -->
    <g transform="translate(30,274)">
      <rect x="0" y="0" width="330" height="68" rx="12" fill="#fff7e8" stroke="#f2d28b" stroke-width="1.5"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#6b4c00">💡 El error sigue siendo el mismo, pero ahora…</text>
      <text x="12" y="34" font-family="sans-serif" font-size="9" fill="#6b7280">• La causa original no se pierde (from)</text>
      <text x="12" y="48" font-family="sans-serif" font-size="9" fill="#6b7280">• Cualquiera puede agregar contexto (notas)</text>
      <text x="12" y="62" font-family="sans-serif" font-size="8" fill="#8a6d1a">→ el validador forense lo verifica todo</text>
    </g>
  </g>

  <defs><marker id="a1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a2340"/></marker></defs>
  <text x="450" y="500" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#6b4c00">📝 Un buen expediente guarda la causa y deja lugar para notas — así el forense reconstruye la historia completa.</text>
</svg>