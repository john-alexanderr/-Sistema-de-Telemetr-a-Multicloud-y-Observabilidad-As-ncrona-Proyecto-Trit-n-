<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="La nota del investigador add_note y la causa original del error">
  <rect x="0" y="0" width="480" height="240" fill="#fff7e8"/>

  <g transform="translate(60,70) rotate(-4)">
    <rect x="0" y="0" width="170" height="120" rx="6" fill="#ffffff" stroke="#c9b37a" stroke-width="2"/>
    <g fill="none" stroke="#dcd3bd" stroke-width="3" stroke-linecap="round">
      <line x1="18" y1="24" x2="150" y2="24"/>
      <line x1="18" y1="40" x2="120" y2="40"/>
      <line x1="18" y1="56" x2="140" y2="56"/>
      <line x1="18" y1="72" x2="96" y2="72"/>
    </g>
    <text x="18" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#4a328f">EXPEDIENTE</text>
    <text x="18" y="104" font-family="sans-serif" font-size="11" fill="#555">ProviderTimeoutError</text>

    <g transform="translate(96,-18) rotate(6)">
      <rect x="0" y="0" width="84" height="52" fill="#ffe34d" stroke="#e6c200" stroke-width="2"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#6b4c00">🟨 NOTA (add_note)</text>
      <text x="10" y="38" font-family="sans-serif" font-size="9" fill="#6b4c00">"Azure tardó 2 s"</text>
    </g>
  </g>

  <g transform="translate(300,60)">
    <text x="60" y="10" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#4056a1">La causa original viaja con el error</text>
    <path d="M30 30 L74 30 L82 48 L22 48 Z" fill="#9db4e8"/>
    <text x="42" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#24316b">httpx</text>
    <path d="M52 48 v22" stroke="#4056a1" stroke-width="4" marker-end="url(#flecha)"/>
    <text x="52" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4056a1">from</text>
    <rect x="18" y="90" width="74" height="34" rx="6" fill="#e25563"/>
    <text x="36" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">Triton Error</text>
    <defs>
      <marker id="flecha" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#4056a1"/>
      </marker>
    </defs>
  </g>

  <text x="240" y="226" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#24316b">📝 Conserve la causa e incluso deje notas amarillas</text>
</svg>