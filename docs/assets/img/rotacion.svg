<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="El libro de registros se rota al llegar a 2 MB y se comprime con gzip">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#fff7e8"/>

  <g transform="translate(450,36)">
    <rect x="-300" y="-20" width="600" height="40" rx="20" fill="#1a2340"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">📕 EL LIBRO QUE CRECE SIN PARAR — <tspan fill="#fff">RotatingFileHandler + gzip</tspan></text>
  </g>

  <!-- left: problema -->
  <g transform="translate(40,78)">
    <rect x="0" y="0" width="400" height="100" rx="14" fill="#fff" stroke="#e25563" stroke-width="2.5"/>
    <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#8b1a1a">📕 Sin rotación: el libro crece para siempre</text>
    <g transform="translate(16,32)">
      <rect x="0" y="0" width="70" height="42" rx="6" fill="#fdecea" stroke="#e25563" stroke-width="1.5"/><text x="35" y="16" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#8b1a1a">.log</text><text x="35" y="28" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#a4262c">12 MB</text>
      <text x="78" y="24" font-family="sans-serif" font-size="10" fill="#e25563">→</text>
      <rect x="94" y="0" width="70" height="42" rx="6" fill="#fdecea" stroke="#e25563" stroke-width="1.5"/><text x="129" y="16" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#8b1a1a">.log</text><text x="129" y="28" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#a4262c">48 MB</text>
      <text x="172" y="24" font-family="sans-serif" font-size="10" fill="#e25563">→</text>
      <rect x="188" y="0" width="70" height="42" rx="6" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="1.5"/><text x="223" y="16" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">.log</text><text x="223" y="28" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#ffd7db">240 MB 💥</text>
    </g>
    <text x="16" y="88" font-family="sans-serif" font-size="9" fill="#6b7280">→ Disco lleno · el Reino se queda sin espacio.</text>
  </g>

  <g transform="translate(470,78)">
    <rect x="0" y="0" width="390" height="100" rx="14" fill="#e8f5e9" stroke="#1f9d55" stroke-width="2.5"/>
    <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#145a32">✅ Con rotación: límite de 2 MB, 3 respaldos</text>
    <g transform="translate(16,32)">
      <rect x="0" y="0" width="84" height="36" rx="8" fill="#1f9d55"/><text x="42" y="14" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#fff">triton.jsonl</text><text x="42" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="#c8f0d0">≤ 2 MB</text>
      <text x="92" y="20" font-size="10" fill="#1f9d55">→</text>
      <rect x="106" y="0" width="84" height="36" rx="8" fill="#fff" stroke="#1f9d55" stroke-width="1.5"/><text x="148" y="14" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#145a32">.1 · .2 · .3</text><text x="148" y="26" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#2e7d32">3 respaldos</text>
    </g>
    <text x="16" y="88" font-family="sans-serif" font-size="9" fill="#145a32">Cuando el activo llena 2 MB → se rota y empieza uno nuevo.</text>
  </g>

  <!-- main diagram -->
  <g transform="translate(40,196)">
    <rect x="0" y="0" width="820" height="210" rx="16" fill="#fff" stroke="#8a6d1a" stroke-width="2.5"/>
    <text x="410" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#6b4c00">🔄 Cómo funciona la rotación paso a paso</text>

    <!-- step 1 -->
    <g transform="translate(18,36)">
      <rect x="0" y="0" width="150" height="76" rx="12" fill="#c0392b" stroke="#8b1a1a" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">① Libro activo</text>
      <rect x="10" y="26" width="130" height="30" rx="6" fill="#fff" opacity="0.95"/><text x="75" y="40" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#8b1a1a">triton.jsonl</text><text x="75" y="50" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#a4262c">escribiendo… 2.0 MB</text>
      <text x="75" y="68" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="700" fill="#ffd7db">¡Lleno!</text>
    </g>
    <g transform="translate(178,70)"><path d="M0 0 L28 0" stroke="#8a6d1a" stroke-width="3" marker-end="url(#r1)"/></g>

    <!-- step 2 -->
    <g transform="translate(216,36)">
      <rect x="0" y="0" width="150" height="76" rx="12" fill="#fff" stroke="#8a6d1a" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#6b4c00">② Rotar</text>
      <text x="75" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">.log → .log.1</text>
      <text x="75" y="48" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">.log.1 → .log.2 …</text>
      <text x="75" y="62" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" fill="#6b4c00">🔄 rotator()</text>
    </g>
    <g transform="translate(376,70)"><path d="M0 0 L28 0" stroke="#8a6d1a" stroke-width="3" marker-end="url(#r1)"/></g>

    <!-- step 3 -->
    <g transform="translate(414,18)">
      <rect x="0" y="0" width="170" height="112" rx="12" fill="#6b4fa1" stroke="#4a328f" stroke-width="2.5"/>
      <text x="85" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fff">③ Comprimir con gzip</text>
      <g transform="translate(14,26)">
        <rect x="0" y="0" width="142" height="28" rx="8" fill="#fff"/><text x="71" y="18" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#4a328f">triton.jsonl.1</text>
        <text x="71" y="38" text-anchor="middle" font-size="14">⬇️</text>
        <rect x="0" y="50" width="142" height="28" rx="8" fill="#ffd25c" stroke="#d9a017" stroke-width="1.5"/><text x="71" y="68" text-anchor="middle" font-family="monospace" font-size="8" font-weight="800" fill="#6b4c00">triton.jsonl.1.gz</text>
      </g>
      <text x="85" y="104" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#d9ccff">ocupa ~10× menos</text>
    </g>
    <g transform="translate(594,70)"><path d="M0 0 L28 0" stroke="#8a6d1a" stroke-width="3" marker-end="url(#r1)"/></g>

    <!-- step 4 -->
    <g transform="translate(632,36)">
      <rect x="0" y="0" width="170" height="76" rx="12" fill="#e8f5e9" stroke="#1f9d55" stroke-width="2"/>
      <text x="85" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#145a32">④ Nuevo libro</text>
      <rect x="20" y="26" width="130" height="30" rx="6" fill="#1f9d55"/><text x="85" y="40" text-anchor="middle" font-family="monospace" font-size="8" font-weight="800" fill="#fff">triton.jsonl</text><text x="85" y="50" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#c8f0d0">vacío, listo</text>
      <text x="85" y="68" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#2e7d32">sigue escribiendo ✅</text>
    </g>

    <!-- roles -->
    <g transform="translate(18,132)">
      <rect x="0" y="0" width="374" height="48" rx="12" fill="#fff7e8" stroke="#f2d28b" stroke-width="1.5"/>
      <text x="10" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#6b4c00">🏷️ namer → decide el nombre ".1.gz"</text>
      <text x="10" y="32" font-family="sans-serif" font-size="9" fill="#8a6d1a">ej: <tspan font-family="monospace">triton.jsonl.1.gz</tspan></text>
      <text x="10" y="44" font-family="sans-serif" font-size="8" fill="#6b7280">🔄 rotator → mueve el archivo viejo y lo comprime</text>
    </g>
    <g transform="translate(414,132)">
      <rect x="0" y="0" width="388" height="48" rx="12" fill="#eef4ff" stroke="#8fa0c7" stroke-width="1.5"/>
      <text x="12" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#24316b">📊 Resultado final en disco:</text>
      <text x="12" y="32" font-family="monospace" font-size="8" fill="#24316b">triton.jsonl (≤2 MB) · .1.gz · .2.gz · .3.gz</text>
      <text x="12" y="44" font-family="sans-serif" font-size="8" fill="#6b7280">4 archivos como máximo — nunca crece sin control</text>
    </g>
  </g>

  <defs><marker id="r1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a6d1a"/></marker></defs>
  <text x="450" y="500" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#6b4c00">El libro nunca se desborda: se archiva, se encoge y se renueva — como una biblioteca ordenada.</text>
</svg>