<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="La gran tormenta: tres territorios con tres resultados distintos">
  <defs>
    <linearGradient id="noche2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2340"/><stop offset="1" stop-color="#3a4a8f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="18" fill="url(#noche2)"/>

  <g transform="translate(450,36)">
    <rect x="-280" y="-20" width="560" height="40" rx="20" fill="#fff" opacity="0.12" stroke="#fff" stroke-width="1.5"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd25c">🌩️ LA GRAN TORMENTA — <tspan fill="#fff">la red falla y cada territorio responde distinto</tspan></text>
  </g>

  <!-- nubes tormenta -->
  <g fill="#1a2340" opacity="0.9">
    <ellipse cx="160" cy="92" rx="120" ry="42"/><ellipse cx="100" cy="82" rx="60" ry="28"/><ellipse cx="220" cy="80" rx="70" ry="30"/>
    <ellipse cx="450" cy="88" rx="130" ry="44"/><ellipse cx="390" cy="78" rx="62" ry="30"/><ellipse cx="510" cy="78" rx="68" ry="30"/>
    <ellipse cx="740" cy="94" rx="110" ry="40"/><ellipse cx="690" cy="84" rx="56" ry="26"/><ellipse cx="790" cy="82" rx="60" ry="28"/>
  </g>
  <!-- rayos -->
  <g fill="#ffd25c">
    <path d="M210 98 l-14 30 h18 l-10 32 l26 -34 h-16 l14 -28 z"/>
    <path d="M450 96 l-14 30 h18 l-10 32 l26 -34 h-16 l14 -28 z"/>
    <path d="M720 100 l-14 30 h18 l-10 32 l26 -34 h-16 l14 -28 z"/>
  </g>
  <g stroke="#8fb4ff" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M140 138 l-10 40 M150 138 l-6 40 M440 138 l-8 40 M460 138 l-10 40 M700 138 l-10 40 M720 138 l-8 40"/>
  </g>

  <!-- tres territorios resultado -->
  <g transform="translate(40,176)">
    <!-- AWS OK -->
    <g>
      <rect x="0" y="0" width="260" height="260" rx="16" fill="#fff" stroke="#1f9d55" stroke-width="3"/>
      <rect x="0" y="0" width="260" height="48" rx="16" fill="#1f9d55"/><rect x="0" y="32" width="260" height="16" fill="#1f9d55"/>
      <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff">☁️ AWS</text>
      <text x="130" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#c8f0d0">Territorio Este</text>
      <g transform="translate(70,62)">
        <circle cx="60" cy="46" r="46" fill="#e8f5e9" stroke="#1f9d55" stroke-width="3"/>
        <path d="M36 46 l18 18 l32 -34" fill="none" stroke="#1f9d55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="130" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#145a32">✅ Responde OK</text>
      <rect x="14" y="188" width="232" height="56" rx="10" fill="#e8f5e9" stroke="#a8d8b9" stroke-width="1.5"/>
      <text x="20" y="208" font-family="monospace" font-size="9" fill="#145a32">{"cluster":"aws-1",</text>
      <text x="20" y="222" font-family="monospace" font-size="9" fill="#145a32"> "status":"ok"}</text>
      <text x="20" y="236" font-family="sans-serif" font-size="8" fill="#2e7d32">200 OK · JSON válido → el Rey lo lee</text>
    </g>
    <!-- Azure Timeout -->
    <g transform="translate(320,0)">
      <rect x="0" y="0" width="260" height="260" rx="16" fill="#fff" stroke="#d9a017" stroke-width="3"/>
      <rect x="0" y="0" width="260" height="48" rx="16" fill="#d9a017"/><rect x="0" y="32" width="260" height="16" fill="#d9a017"/>
      <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff">☁️ AZURE</text>
      <text x="130" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#fff7cc">Territorio Norte</text>
      <g transform="translate(70,62)">
        <circle cx="60" cy="46" r="46" fill="#fff7e8" stroke="#d9a017" stroke-width="3"/>
        <text x="60" y="62" text-anchor="middle" font-size="32">⏳</text>
        <g opacity="0.9">
          <circle cx="60" cy="46" r="46" fill="none" stroke="#d9a017" stroke-width="3" stroke-dasharray="8 6">
            <animateTransform attributeName="transform" type="rotate" from="0 60 46" to="360 60 46" dur="2s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
      <text x="130" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#6b4c00">⏳ Nunca responde</text>
      <rect x="14" y="188" width="232" height="56" rx="10" fill="#fff7e8" stroke="#f2d28b" stroke-width="1.5"/>
      <text x="20" y="208" font-family="sans-serif" font-size="9" font-weight="700" fill="#6b4c00">1 s… 2 s… ⏰ timeout</text>
      <text x="20" y="222" font-family="monospace" font-size="9" fill="#6b4c00">httpx.TimeoutException</text>
      <text x="20" y="236" font-family="sans-serif" font-size="8" fill="#8a6d1a">→ ProviderTimeoutError</text>
    </g>
    <!-- GCP Corrupted -->
    <g transform="translate(600,0)">
      <rect x="0" y="0" width="260" height="260" rx="16" fill="#fff" stroke="#e25563" stroke-width="3"/>
      <rect x="0" y="0" width="260" height="48" rx="16" fill="#e25563"/><rect x="0" y="32" width="260" height="16" fill="#e25563"/>
      <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff">☁️ GCP</text>
      <text x="130" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#ffd7db">Territorio Oeste</text>
      <g transform="translate(70,62)">
        <circle cx="60" cy="46" r="46" fill="#fdecea" stroke="#e25563" stroke-width="3"/>
        <text x="60" y="58" text-anchor="middle" font-size="28">📄</text>
        <text x="78" y="36" text-anchor="middle" font-size="16">❌</text>
        <text x="60" y="74" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="800" fill="#8b1a1a">&lt;xml&gt; ?!</text>
      </g>
      <text x="130" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#8b1a1a">📦 Respuesta rota</text>
      <rect x="14" y="188" width="232" height="56" rx="10" fill="#fdecea" stroke="#f0a0a8" stroke-width="1.5"/>
      <text x="20" y="208" font-family="monospace" font-size="9" fill="#8b1a1a">&lt;html&gt; &lt;xml&gt; …</text>
      <text x="20" y="222" font-family="monospace" font-size="9" fill="#8b1a1a">JSONDecodeError</text>
      <text x="20" y="236" font-family="sans-serif" font-size="8" fill="#a4262c">→ CorruptedPayloadError</text>
    </g>
  </g>

  <!-- bottom -->
  <g transform="translate(40,454)">
    <rect x="0" y="0" width="820" height="48" rx="12" fill="#fff" opacity="0.12" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffd25c">No basta con decir "algo falló" —</text>
    <text x="16" y="36" font-family="sans-serif" font-size="11" fill="#fff">el Rey necesita saber <tspan font-weight="800">qué</tspan> falló y <tspan font-weight="800">dónde</tspan>. Por eso existe el Tribunal de Errores (siguiente escena).</text>
    <text x="760" y="28" font-size="18">⚖️→</text>
  </g>
</svg>